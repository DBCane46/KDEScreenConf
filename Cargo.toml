[package]
name = "kdescreenconf"
version = "0.3.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Plasma 6 monitor profiles, window zones, drag overlays and a visual layout editor"
repository = "https://github.com/DBCane46/KDEScreenConf"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", features = ["blocking-api"] }
